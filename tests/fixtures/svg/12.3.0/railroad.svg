<style>#m2v-probe{font-family:Segoe UI,sans-serif;font-size:14px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#m2v-probe .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#m2v-probe .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#m2v-probe .error-icon{fill:#552222;}#m2v-probe .error-text{fill:#552222;stroke:#552222;}#m2v-probe .edge-thickness-normal{stroke-width:1px;}#m2v-probe .edge-thickness-thick{stroke-width:3.5px;}#m2v-probe .edge-pattern-solid{stroke-dasharray:0;}#m2v-probe .edge-thickness-invisible{stroke-width:0;fill:none;}#m2v-probe .edge-pattern-dashed{stroke-dasharray:3;}#m2v-probe .edge-pattern-dotted{stroke-dasharray:2;}#m2v-probe .marker{fill:#01579b;stroke:#01579b;}#m2v-probe .marker.cross{stroke:#01579b;}#m2v-probe svg{font-family:Segoe UI,sans-serif;font-size:14px;}#m2v-probe p{margin:0;}#m2v-probe .railroad-diagram{font-family:Segoe UI,sans-serif;font-size:14px;}#m2v-probe .railroad-terminal rect{fill:hsl(0, 0%, 98.9215686275%);stroke:hsl(0, 0%, 88.9215686275%);stroke-width:2px;}#m2v-probe .railroad-terminal text{fill:rgb(2.7499999999, 2.7499999999, 2.7499999999);font-family:Segoe UI,sans-serif;font-size:14px;text-anchor:middle;dominant-baseline:middle;}#m2v-probe .railroad-nonterminal rect{fill:#eee;stroke:#01579b;stroke-width:2px;}#m2v-probe .railroad-nonterminal text{fill:#000;font-family:Segoe UI,sans-serif;font-size:14px;text-anchor:middle;dominant-baseline:middle;}#m2v-probe .railroad-line{stroke:#01579b;stroke-width:2px;fill:none;}#m2v-probe .railroad-start circle,#m2v-probe .railroad-end circle{fill:#01579b;}#m2v-probe .railroad-comment ellipse{fill:rgba(232,232,232, 0.8);stroke:hsl(-160, 0%, 83.3333333333%);stroke-width:2px;}#m2v-probe .railroad-comment text{fill:rgb(17.0000000001, 17.0000000001, 17.0000000001);font-style:italic;font-family:Segoe UI,sans-serif;font-size:14px;text-anchor:middle;dominant-baseline:middle;}#m2v-probe .railroad-special rect{fill:#ffffff;stroke:hsl(-160, 0%, 83.3333333333%);stroke-width:2px;stroke-dasharray:5,3;}#m2v-probe .railroad-special text{fill:#000;font-family:Segoe UI,sans-serif;font-size:14px;text-anchor:middle;dominant-baseline:middle;}#m2v-probe .railroad-rule-name{font-weight:bold;fill:#333;font-family:Segoe UI,sans-serif;font-size:14px;}#m2v-probe .node .neo-node{stroke:#999;}#m2v-probe [data-look="neo"].node rect,#m2v-probe [data-look="neo"].cluster rect,#m2v-probe [data-look="neo"].node polygon{stroke:url(#m2v-probe-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m2v-probe [data-look="neo"].swimlane.cluster rect{filter:none;}#m2v-probe [data-look="neo"].node path{stroke:url(#m2v-probe-gradient);stroke-width:1px;}#m2v-probe [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m2v-probe [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#m2v-probe [data-look="neo"].node circle{stroke:url(#m2v-probe-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m2v-probe [data-look="neo"].node circle .state-start{fill:#000000;}#m2v-probe [data-look="neo"].icon-shape .icon{fill:url(#m2v-probe-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m2v-probe [data-look="neo"].icon-shape .icon-neo path{stroke:url(#m2v-probe-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m2v-probe :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style>
