<style>#m2v-probe{font-family:Segoe UI,sans-serif;font-size:14px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#m2v-probe .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#m2v-probe .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#m2v-probe .error-icon{fill:#552222;}#m2v-probe .error-text{fill:#552222;stroke:#552222;}#m2v-probe .edge-thickness-normal{stroke-width:1px;}#m2v-probe .edge-thickness-thick{stroke-width:3.5px;}#m2v-probe .edge-pattern-solid{stroke-dasharray:0;}#m2v-probe .edge-thickness-invisible{stroke-width:0;fill:none;}#m2v-probe .edge-pattern-dashed{stroke-dasharray:3;}#m2v-probe .edge-pattern-dotted{stroke-dasharray:2;}#m2v-probe .marker{fill:#01579b;stroke:#01579b;}#m2v-probe .marker.cross{stroke:#01579b;}#m2v-probe svg{font-family:Segoe UI,sans-serif;font-size:14px;}#m2v-probe p{margin:0;}#m2v-probe .ishikawa .ishikawa-spine,#m2v-probe .ishikawa .ishikawa-branch,#m2v-probe .ishikawa .ishikawa-sub-branch{stroke:#01579b;stroke-width:2;fill:none;}#m2v-probe .ishikawa .ishikawa-sub-branch{stroke-width:1;}#m2v-probe .ishikawa .ishikawa-arrow{fill:#01579b;}#m2v-probe .ishikawa .ishikawa-head{fill:#eee;stroke:#01579b;stroke-width:2;}#m2v-probe .ishikawa .ishikawa-label-box{fill:#eee;stroke:#01579b;stroke-width:2;}#m2v-probe .ishikawa text{font-family:Segoe UI,sans-serif;font-size:14px;fill:#000000;}#m2v-probe .ishikawa .ishikawa-head-label{font-weight:600;text-anchor:middle;dominant-baseline:middle;font-size:14px;}#m2v-probe .ishikawa .ishikawa-label{text-anchor:end;}#m2v-probe .ishikawa .ishikawa-label.cause{text-anchor:middle;dominant-baseline:middle;}#m2v-probe .ishikawa .ishikawa-label.align{text-anchor:end;dominant-baseline:middle;}#m2v-probe .ishikawa .ishikawa-label.up{dominant-baseline:baseline;}#m2v-probe .ishikawa .is