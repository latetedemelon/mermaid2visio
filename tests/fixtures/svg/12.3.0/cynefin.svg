<svg id="m2v-probe" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 880px;" viewBox="0 0 880 680" role="graphics-document document" aria-roledescription="cynefin">
<style>#m2v-probe{font-family:Segoe UI,sans-serif;font-size:14px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#m2v-probe .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#m2v-probe .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#m2v-probe .error-icon{fill:#552222;}#m2v-probe .error-text{fill:#552222;stroke:#552222;}#m2v-probe .edge-thickness-normal{stroke-width:1px;}#m2v-probe .edge-thickness-thick{stroke-width:3.5px;}#m2v-probe .edge-pattern-solid{stroke-dasharray:0;}#m2v-probe .edge-thickness-invisible{stroke-width:0;fill:none;}#m2v-probe .edge-pattern-dashed{stroke-dasharray:3;}#m2v-probe .edge-pattern-dotted{stroke-dasharray:2;}#m2v-probe .marker{fill:#01579b;stroke:#01579b;}#m2v-probe .marker.cross{stroke:#01579b;}#m2v-probe svg{font-family:Segoe UI,sans-serif;font-size:14px;}#m2v-probe p{margin:0;}#m2v-probe .cynefinDomain{stroke:none;}#m2v-probe .cynefinDomainLabel{font-size:16px;font-weight:bold;fill:#000;}#m2v-probe .cynefinSubtitle{font-size:11px;fill:#000000;font-style:italic;}#m2v-probe .cynefinItem{fill-opacity:0.95;stroke:#01579b;stroke-width:1;}#m2v-probe .cynefinItemText{font-size:12px;fill:#000000;}#m2v-probe .cynefinItemOverflow{fill-opacity:0.6;stroke:#01579b;stroke-width:1;stroke-dasharray:3 2;}#m2v-probe .cynefinBoundary{stroke:#01579b;stroke-width:2;stroke-dasharray:6 3;}#m2v-probe .cynefinCliff{stroke:#8B0000;stroke-width:4;}#m2v-probe .cynefinConfusion{stroke:#01579b;stroke-width:1.5;stroke-dasharray:4 2;}#m2v-probe .cynefinArrowLine{stroke:#01579b;stroke-width:2;fill:none;}#m2v-probe .cynefinArrowHead{fill:#01579b;stroke:none;}#m2v-probe .cynefinArrowLabel{font-size:11px;fill:#000000;}#m2v-probe .cynefinTitle{font-size:18px;font-weight:bold;fill:#000;}#m2v-probe .node .neo-node{stroke:#999;}#m2v-probe [data-look="neo"].node rect,#m2v-probe [data-look="neo"].cluster rect,#m2v-probe [data-look="neo"].node polygon{stroke:url(#m2v-probe-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m2v-probe [data-look="neo"].swimlane.cluster rect{filter:none;}#m2v-probe [data-look="neo"].node path{stroke:url(#m2v-probe-gradient);stroke-width:1px;}#m2v-probe [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m2v-probe [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#m2v-probe [data-look="neo"].node circle{stroke:url(#m2v-probe-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m2v-probe [data-look="neo"].node circle .state-start{fill:#000000;}#m2v-probe [data-look="neo"].icon-shape .icon{fill:url(#m2v-probe-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m2v-probe [data-look="neo"].icon-shape .icon-neo path{stroke:url(#m2v-probe-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#m2v-probe :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style>
